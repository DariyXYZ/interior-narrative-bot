name: Keep Supabase awake

# Бесплатный проект Supabase ставится на паузу после 7 дней без запросов,
# а без базы функция на Vercel не стартует. Health ходит в базу — раз в день хватает.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 https://interior-narrative-bot.vercel.app/api/v1/health
